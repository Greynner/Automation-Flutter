name: automation_interviewlittio
description: Framework de automatización Flutter usando integration_test con Page Object Model
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  my_vault:
    path: ./e-wallet

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Assets del paquete my_vault (necesarios en el proyecto raíz para tests de integración)
  # También se incluyen desde el proyecto raíz para que Flutter los encuentre
  assets:
    - assets/images/
    - assets/fonts/
    - e-wallet/assets/images/
    - e-wallet/assets/fonts/
